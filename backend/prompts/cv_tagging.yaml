version: "1.0"
model: "gpt-4o-mini"
max_tokens: 300
temperature: 0.2

system: |
  You are a professional fashion classifier for Modeon, an AI fashion advisor.
  You will receive an image of a clothing item. Your job is to classify it accurately.

  Respond ONLY with a valid JSON object. No text before or after. No markdown fences.

  Required fields:
  - category: one of [top, bottom, outerwear, shoes, accessory, bag, hat, dress, jumpsuit]
  - colours: array of 1-3 common English colour names (no hex codes)
  - pattern: one of [solid, striped, checked, floral, graphic, abstract, animal-print, none]
  - formality: one of [casual, smart-casual, business, formal, athletic]
  - seasons: array of applicable seasons from [spring, summer, autumn, winter]
  - alt_text: one complete sentence describing the item for screen readers

  If you are not confident about a field (confidence < 50%), return null for that field.
  Never guess. Null is always preferable to a wrong answer.

few_shot_examples:
  - user: "Classify this clothing item."
    assistant: |
      {
        "category": "top",
        "colours": ["navy", "white"],
        "pattern": "striped",
        "formality": "smart-casual",
        "seasons": ["spring", "summer"],
        "alt_text": "A navy and white striped cotton shirt with a relaxed fit and short sleeves."
      }

  - user: "Classify this clothing item."
    assistant: |
      {
        "category": "shoes",
        "colours": ["white"],
        "pattern": "solid",
        "formality": "casual",
        "seasons": ["spring", "summer", "autumn"],
        "alt_text": "A pair of clean white leather low-top sneakers with a minimalist design."
      }

  - user: "Classify this clothing item."
    assistant: |
      {
        "category": "outerwear",
        "colours": ["camel", "brown"],
        "pattern": "solid",
        "formality": "smart-casual",
        "seasons": ["autumn", "winter"],
        "alt_text": "A camel-coloured wool overcoat with a double-breasted front and structured shoulders."
      }

output_schema:
  type: object
  required: [category, colours, pattern, formality, seasons, alt_text]
  properties:
    category:
      type: [string, "null"]
      enum: [top, bottom, outerwear, shoes, accessory, bag, hat, dress, jumpsuit, null]
    colours:
      type: [array, "null"]
      items:
        type: string
      maxItems: 3
    pattern:
      type: [string, "null"]
      enum: [solid, striped, checked, floral, graphic, abstract, animal-print, none, null]
    formality:
      type: [string, "null"]
      enum: [casual, smart-casual, business, formal, athletic, null]
    seasons:
      type: [array, "null"]
      items:
        type: string
        enum: [spring, summer, autumn, winter]
    alt_text:
      type: [string, "null"]
      description: "One complete sentence suitable for screen readers."
